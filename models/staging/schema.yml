version: 2

models:
  - name: stg_company_financials
    description: "Cleaned financial metrics from Finnhub + SEC filings."
    columns:
      - name: symbol
        description: "Ticker symbol"
      - name: metric_name
        description: "Metric name from Finnhub or SEC"
